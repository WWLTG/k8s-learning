apiVersion: batch/v1
kind: Job
metadata:
  name: example-job
  namespace: default
spec:
  completions: 2
  parallelism: 1
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: example-job
    spec:
      restartPolicy: Never
      containers:
        - name: task
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Job started on $HOSTNAME"
              echo "Job completed successfully"
