apiVersion: v1
kind: Namespace
metadata:
  name: dynamic-storage-example
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dynamic-example-pvc
  namespace: dynamic-storage-example
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamic-storage-demo
  namespace: dynamic-storage-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamic-storage-demo
  template:
    metadata:
      labels:
        app: dynamic-storage-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          volumeMounts:
            - name: app-data
              mountPath: /usr/share/nginx/html
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: dynamic-example-pvc
