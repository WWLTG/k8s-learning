apiVersion: v1
kind: Namespace
metadata:
  name: quota-policy-example
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: quota-policy-example
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 64Mi
      default:
        cpu: 250m
        memory: 128Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-budget
  namespace: quota-policy-example
spec:
  hard:
    requests.cpu: 500m
    requests.memory: 512Mi
    limits.cpu: "1"
    limits.memory: 1Gi
    pods: "5"
