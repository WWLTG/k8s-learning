apiVersion: v1
kind: Pod
metadata:
  name: secret-volume-demo
  namespace: secret-example
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "ls -l /etc/app-secret; sleep 3600"]
      volumeMounts:
        - name: app-secret-volume
          mountPath: /etc/app-secret
          readOnly: true
  volumes:
    - name: app-secret-volume
      secret:
        secretName: app-secret
