apiVersion: apps/v1
kind: Deployment
metadata:
  name: keyref-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keyref-demo
  template:
    metadata:
      labels:
        app: keyref-demo
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_ENV
