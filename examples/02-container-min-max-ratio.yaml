apiVersion: v1
kind: LimitRange
metadata:
  name: container-constraints
  namespace: example-namespace
spec:
  limits:
    - type: Container
      min:
        cpu: 50m
        memory: 32Mi
      max:
        cpu: "1"
        memory: 512Mi
      maxLimitRequestRatio:
        cpu: "4"
        memory: "4"
