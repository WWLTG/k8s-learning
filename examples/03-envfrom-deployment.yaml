apiVersion: apps/v1
kind: Deployment
metadata:
  name: envfrom-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envfrom-demo
  template:
    metadata:
      labels:
        app: envfrom-demo
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          envFrom:
            - configMapRef:
                name: app-config
