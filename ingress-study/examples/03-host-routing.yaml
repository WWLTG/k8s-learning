apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: host-routing
  namespace: default
spec:
  ingressClassName: example-controller
  rules:
    - host: frontend.example.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
    - host: api.example.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 8080
