apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: routing-demo
  namespace: ingress-routing-lab
spec:
  rules:
    - host: routing-lab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: routing-demo-service
                port:
                  number: 80
