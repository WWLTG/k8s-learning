apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ingress-lab-04
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
        - name: create-page
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /work/api
              printf 'api pod: %s\n' "$POD_NAME" > /work/api/index.html
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: content
              mountPath: /work
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /api/
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
      volumes:
        - name: content
          emptyDir: {}
