apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-demo
  namespace: storage-lab-01
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage-demo
  template:
    metadata:
      labels:
        app: storage-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          command:
            - /bin/sh
            - -c
          args:
            - |
              if [ ! -f /usr/share/nginx/html/index.html ]; then
                echo "persistent data created by $HOSTNAME" > /usr/share/nginx/html/index.html
              fi
              nginx -g 'daemon off;'
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: app-data
              mountPath: /usr/share/nginx/html
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: storage-app-data-claim
