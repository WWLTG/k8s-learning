apiVersion: apps/v1
kind: Deployment
metadata:
  name: configmap-demo
  namespace: configmap-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: configmap-demo
  template:
    metadata:
      labels:
        app: configmap-demo
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_MODE
          envFrom:
            - configMapRef:
                name: application-config
