apiVersion: v1
kind: Namespace
metadata:
  name: deployment-lab-01
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
  namespace: deployment-lab-01
  labels:
    app: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 2
