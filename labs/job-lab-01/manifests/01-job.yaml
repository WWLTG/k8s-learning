apiVersion: batch/v1
kind: Job
metadata:
  name: report-generator
  namespace: job-lab-01
spec:
  completions: 3
  parallelism: 1
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: report-generator
    spec:
      restartPolicy: Never
      containers:
        - name: report-task
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Starting report task on $HOSTNAME"
              test -f /work/input.txt
              echo "Report task completed"
