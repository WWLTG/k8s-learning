apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: backend-namespace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        tier: backend
    spec:
      containers:
        - name: nginx
          image: nginx:1.27.5
          ports:
            - name: http
              containerPort: 80
