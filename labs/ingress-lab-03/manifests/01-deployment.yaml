apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-demo
  namespace: ingress-controller-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: controller-demo
  template:
    metadata:
      labels:
        app: controller-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          command:
            - /bin/sh
            - -c
          args:
            - |
              cat > /usr/share/nginx/html/index.html <<'EOF'
              Ingress Controller Lab 03
              EOF
              exec nginx -g 'daemon off;'
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
