apiVersion: apps/v1
kind: Deployment
metadata:
  name: configmap-volume-demo
  namespace: configmap-volume-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: configmap-volume-demo
  template:
    metadata:
      labels:
        app: configmap-volume-demo
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - cat /etc/app/app.properties && sleep 3600
          volumeMounts:
            - name: config-volume
              mountPath: /etc/app
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: file-config
            items:
              - key: application.properties
                path: app.properties
