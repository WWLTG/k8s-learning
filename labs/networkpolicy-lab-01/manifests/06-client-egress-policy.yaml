apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: approved-client-egress
  namespace: networkpolicy-lab-01
spec:
  podSelector:
    matchLabels:
      app: client
      access: web
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 80
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
