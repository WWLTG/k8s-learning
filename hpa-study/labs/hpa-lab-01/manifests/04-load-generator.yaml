apiVersion: v1
kind: Pod
metadata:
  name: hpa-load-generator
  namespace: hpa-lab-01
  labels:
    app: hpa-load-generator
spec:
  restartPolicy: Always
  containers:
    - name: load-generator
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          while true; do
            wget -q -O- http://hpa-demo-service.hpa-lab-01.svc.cluster.local/ >/dev/null 2>&1
          done
