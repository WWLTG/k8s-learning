apiVersion: v1
kind: Namespace
metadata:
  name: static-storage-example
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: manual-example
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: Immediate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: static-example-pv
spec:
  capacity:
    storage: 128Mi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual-example
  hostPath:
    path: /tmp/static-storage-example
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: static-example-pvc
  namespace: static-storage-example
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual-example
  resources:
    requests:
      storage: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: static-storage-demo
  namespace: static-storage-example
spec:
  containers:
    - name: app
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
      args:
        - |
          echo "persistent example data" > /data/message.txt
          sleep 3600
      volumeMounts:
        - name: app-data
          mountPath: /data
  volumes:
    - name: app-data
      persistentVolumeClaim:
        claimName: static-example-pvc
