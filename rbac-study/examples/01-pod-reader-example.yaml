apiVersion: v1
kind: Namespace
metadata:
  name: rbac-example
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-reader
  namespace: rbac-example
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: rbac-example
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader-binding
  namespace: rbac-example
subjects:
  - kind: ServiceAccount
    name: pod-reader
    namespace: rbac-example
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader
