apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-env-demo
  namespace: secret-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret-env-demo
  template:
    metadata:
      labels:
        app: secret-env-demo
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo Secret values loaded; sleep 3600"]
          env:
            - name: APP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: username
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: password
